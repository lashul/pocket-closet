<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Closet | Designer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="final.css?v=34">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cbb26a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="icon-512.png" alt="Logo"
                    style="height: 50px; width: auto; margin-right: 12px; border-radius: 8px;">
                <span>POCKET CLOSET</span>
                <div class="menu-container" style="margin-left: 0.5rem;">
                    <button id="pancakeMenuBtn" class="btn-icon pancake-btn" title="Menu">☰</button>
                    <div id="pancakeDropdown" class="pancake-dropdown" style="left: 0; right: auto;">
                        <a href="#" id="menuSupport">Support</a>
                        <a href="#" id="menuAbout">About</a>
                    </div>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search your collection...">
                <button id="searchBtn" class="btn-search">🔍</button>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="btn-add" id="openAddModal" onclick="handleOpenAddModal()">
                    <span>+</span> Add Item
                </button>
            </div>
        </header>

        <div class="main-wrapper">
            <aside class="sidebar">
                <div class="filter-section collapsed">
                    <h3>Type</h3>
                    <div class="filter-group" id="filterType">
                        <!-- Types will be populated or listed here -->
                        <label class="filter-option"><input type="checkbox" value="shirt"> Shirt</label>
                        <label class="filter-option"><input type="checkbox" value="t-shirt"> T-Shirt</label>
                        <label class="filter-option"><input type="checkbox" value="blouse"> Blouse</label>
                        <label class="filter-option"><input type="checkbox" value="sweater"> Sweater</label>
                        <label class="filter-option"><input type="checkbox" value="jacket"> Jacket</label>
                        <label class="filter-option"><input type="checkbox" value="suit"> Suit</label>
                        <label class="filter-option"><input type="checkbox" value="dress"> Dress</label>
                        <label class="filter-option"><input type="checkbox" value="skirt"> Skirt</label>
                        <label class="filter-option"><input type="checkbox" value="pants"> Pants</label>
                        <label class="filter-option"><input type="checkbox" value="shorts"> Shorts</label>
                        <label class="filter-option"><input type="checkbox" value="shoes"> Shoes</label>
                        <label class="filter-option"><input type="checkbox" value="sneakers"> Sneakers</label>
                        <label class="filter-option"><input type="checkbox" value="hat"> Hat</label>
                        <label class="filter-option"><input type="checkbox" value="scarf"> Scarf</label>
                    </div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Size</h3>
                    <div class="filter-group" id="filterSize">
                        <!-- We will populate this dynamically or keep it simple -->
                    </div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Brand</h3>
                    <div class="filter-group" id="filterBrand"></div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Color</h3>
                    <div class="filter-group" id="filterColor"></div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Season</h3>
                    <div class="filter-group" id="filterSeason">
                        <label class="filter-option"><input type="checkbox" value="spring"> Spring</label>
                        <label class="filter-option"><input type="checkbox" value="summer"> Summer</label>
                        <label class="filter-option"><input type="checkbox" value="fall"> Fall</label>
                        <label class="filter-option"><input type="checkbox" value="winter"> Winter</label>
                        <label class="filter-option"><input type="checkbox" value="all"> All Season</label>
                    </div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Occasion</h3>
                    <div class="filter-group" id="filterOccasion">
                        <label class="filter-option"><input type="checkbox" value="formal"> Formal</label>
                        <label class="filter-option"><input type="checkbox" value="business"> Business</label>
                        <label class="filter-option"><input type="checkbox" value="casual"> Casual</label>
                        <label class="filter-option"><input type="checkbox" value="activewear"> Activewear</label>
                        <label class="filter-option"><input type="checkbox" value="cocktail"> Cocktail</label>
                    </div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Material</h3>
                    <div class="filter-group" id="filterMaterial"></div>
                </div>
                <div class="filter-section collapsed">
                    <h3>Sex</h3>
                    <div class="filter-group" id="filterSex">
                        <label class="filter-option"><input type="checkbox" value="male"> Male</label>
                        <label class="filter-option"><input type="checkbox" value="female"> Female</label>
                        <label class="filter-option"><input type="checkbox" value="unisex"> Unisex</label>
                    </div>
                </div>

                <div class="filter-section collapsed">
                    <h3>Status</h3>
                    <div class="filter-group" id="filterOwned">
                        <label class="filter-option"><input type="checkbox" value="y"> Still Owned</label>
                        <label class="filter-option"><input type="checkbox" value="n"> Gone</label>
                    </div>
                </div>

                <button class="btn-reset" id="resetFilters">Reset All Filters</button>
            </aside>

            <div style="flex-grow: 1; display: flex; flex-direction: column;">
                <div id="itemCount"
                    style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.5rem; padding-left: 0.5rem;">
                    Loading...</div>
                <main id="inventoryGrid" class="inventory-grid">
                    <!-- Items will be injected here by app.js -->
                </main>
            </div>
        </div>

        <!-- Add/Update Modal -->
        <div id="itemModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">New Addition</h2>
                    <button id="closeModal" class="btn-icon">×</button>
                </div>
                <form id="itemForm">
                    <input type="hidden" id="itemId">

                    <div class="form-group">
                        <label>Item Photo</label>
                        <div class="image-preview" id="imagePreview">
                            <span id="previewText">Click to Upload</span>
                            <img id="previewImg" style="display:none">
                        </div>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <button type="button" class="btn-add" id="triggerCamera"
                            style="margin-top: 10px; font-size: 0.8rem; background: var(--glass); color: #fff; border: 1px solid var(--glass-border);">
                            📷 Take Photo
                        </button>
                    </div>

                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="itemName" required placeholder="e.g. Vintage Leather Jacket">
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Type</label>
                            <select id="itemType" required>
                                <option value="shirt">Shirt</option>
                                <option value="t-shirt">T-Shirt</option>
                                <option value="blouse">Blouse</option>
                                <option value="sweater">Sweater</option>
                                <option value="jacket">Jacket</option>
                                <option value="suit">Suit</option>
                                <option value="dress">Dress</option>
                                <option value="skirt">Skirt</option>
                                <option value="pants">Pants</option>
                                <option value="shorts">Shorts</option>
                                <option value="shoes">Shoes</option>
                                <option value="sneakers">Sneakers</option>
                                <option value="hat">Hat</option>
                                <option value="scarf">Scarf</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Size</label>
                            <input type="text" id="itemSize" placeholder="e.g. M, 42, 10">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Purchase Date</label>
                            <input type="date" id="purchaseDate">
                        </div>
                        <div class="form-group">
                            <label>Amount ($)</label>
                            <input type="number" id="purchaseAmount" step="0.01">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Brand / Designer</label>
                            <input type="text" id="itemBrand" placeholder="e.g. Gucci, Levi's">
                        </div>
                        <div class="form-group">
                            <label>Color</label>
                            <input type="text" id="itemColor" placeholder="e.g. Navy, Emerald">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Season</label>
                            <select id="itemSeason">
                                <option value="spring">Spring</option>
                                <option value="summer">Summer</option>
                                <option value="fall">Fall</option>
                                <option value="winter">Winter</option>
                                <option value="all">All Season</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Occasion</label>
                            <select id="itemOccasion">
                                <option value="casual">Casual</option>
                                <option value="business">Business</option>
                                <option value="formal">Formal</option>
                                <option value="activewear">Activewear</option>
                                <option value="cocktail">Cocktail</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Material / Fabric</label>
                            <input type="text" id="itemMaterial" placeholder="e.g. Silk, 100% Cotton">
                        </div>
                        <div class="form-group">
                            <label>Bought From</label>
                            <input type="text" id="itemBoughtFrom" placeholder="e.g. Nordstrom, Thrift">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description / Notes</label>
                        <textarea id="itemDescription" rows="3"
                            style="width: 100%; background: rgba(45, 48, 52, 1); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; padding: 0.8rem; outline: none; resize: vertical;"></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Sex</label>
                            <select id="itemSex">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="unisex">Unisex</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Still Owned?</label>
                            <select id="stillOwned">
                                <option value="y">Yes</option>
                                <option value="n">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-add btn-save">
                            Save to Closet
                        </button>
                        <button type="button" id="cancelForm" class="btn-add btn-cancel">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Read-Only View Modal -->
        <div id="viewModal" class="modal">
            <div class="modal-content" style="max-width: 800px;">
                <div class="modal-header">
                    <h2 id="viewItemName">Item Details</h2>
                    <button id="closeViewModal" class="btn-icon">×</button>
                </div>
                <div id="viewContent" class="form-grid view-modal-grid">
                    <div class="view-image-container">
                        <img id="viewImage" src=""
                            style="width: 100%; border-radius: 12px; object-fit: cover; max-height: 500px;">
                    </div>
                    <div class="view-details-container" style="color: var(--text-main);">
                        <div style="margin-bottom: 1.5rem;">
                            <span id="viewType"
                                style="color: var(--primary); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;"></span>
                            <h1 id="viewTitle" style="font-size: 2rem; margin: 0.5rem 0;"></h1>
                            <p id="viewBrand" style="color: var(--text-muted); font-size: 1.1rem;"></p>
                        </div>

                        <div class="form-grid" style="font-size: 0.9rem; gap: 1rem;">
                            <div><strong>Size:</strong> <span id="vSize"></span></div>
                            <div><strong>Color:</strong> <span id="vColor"></span></div>
                            <div><strong>Season:</strong> <span id="vSeason"></span></div>
                            <div><strong>Occasion:</strong> <span id="vOccasion"></span></div>
                            <div><strong>Material:</strong> <span id="vMaterial"></span></div>
                            <div><strong>Bought From:</strong> <span id="vBought"></span></div>
                            <div><strong>Value:</strong> $<span id="vAmount"></span></div>
                            <div><strong>Sex:</strong> <span id="vSex"></span></div>
                            <div><strong>Added:</strong> <span id="vDate"></span></div>
                            <div><strong>Status:</strong> <span id="vStatus"></span></div>
                        </div>

                        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                            <strong style="display: block; margin-bottom: 0.5rem;">Notes:</strong>
                            <p id="viewDesc" style="color: var(--text-muted); line-height: 1.6;"></p>
                        </div>

                        <div class="view-actions">
                            <button id="editFromView" class="btn-add">Edit Entry</button>
                            <button id="closeViewBtn" class="btn-add btn-secondary">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="cameraOverlay" class="modal" style="background: rgba(0,0,0,0.95);">
            <div class="modal-content" style="max-width: 400px; padding: 1rem; text-align: center;">
                <video id="video" autoplay playsinline
                    style="width: 100%; border-radius: 12px; transform: scaleX(-1);"></video>
                <canvas id="canvas" style="display:none"></canvas>
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button type="button" id="snap" class="btn-add"
                        style="flex:1; justify-content: center;">Capture</button>
                    <button type="button" id="cancelCamera" class="btn-add"
                        style="flex:1; justify-content: center; background: #333; color: #fff;">Cancel</button>
                </div>
            </div>
        </div>

        <button id="mobileAddBtn" class="mobile-fab" onclick="handleOpenAddModal()">+</button>
        <script src="logic.js?v=34" type="module"></script>
</body>

</html>
